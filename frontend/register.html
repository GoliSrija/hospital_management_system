<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create your account | Hospital Management System</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth-card"><article><p><a href="home.html">← Home</a></p><h1>Create your account</h1><p>Sign in securely to continue to your application.</p>
<form id="registerForm"><label>Full name<input name="username" autocomplete="name" maxlength="120" required></label><label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">Create account</button></form><p class="auth-links">Already registered? <a href="login.html">Sign in</a></p><p class="notice">Authentication requires the Flask API configured in js/config.js.</p></article></main>
<script src="js/config.js" defer></script><script src="js/app.js" defer></script></body></html>
