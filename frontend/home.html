<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    

<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <nav class="navbar">
                <a href="#/dashboard" class="logo">HospitalMS</a>
                <ul class="nav-links">
                    <li><a href="#/dashboard" class="active">Dashboard</a></li>
                    <li><a href="#/patients">Patients</a></li>
                    <li><a href="#/appointments">Appointments</a></li>
                    <li><a href="#/emr">EMR</a></li>
                    <li><a href="#/inventory">Inventory</a></li>
                    <li><a href="#/settings">Settings</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <div id="content">
                <section class="dashboard-section">
                    <h2>Dashboard</h2>
                    <div class="dashboard-cards">
                        <div class="card">
                            <h3>New Patients Today</h3>
                            <p>15</p>
                        </div>
                        <div class="card">
                            <h3>Total Appointments</h3>
                            <p>120</p>
                        </div>
                        <div class="card">
                            <h3>Medical Records Created</h3>
                            <p>75</p>
                        </div>
                        <div class="card">
                            <h3>Inventory Items</h3>
                            <p>100</p>
                        </div>
                    </div>
                    <button class="generate-project-btn">Generate AI Project</button>
                </section>
                <section class="appointments-section">
                    <h2>Appointments</h2>
                    <form>
                        <input type="text" placeholder="Search Patient Name" />
                        <input type="date" placeholder="Date" />
                        <button type="submit">Search</button>
                    </form>
                    <table>
                        <thead>
                            <tr>
                                <th>Patient ID</th>

<script src="js/config.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
